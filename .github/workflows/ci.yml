name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: fmt / clippy / build / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Build
        run: cargo build --workspace --all-features

      - name: Test
        run: cargo test --workspace --all-features

      - name: Feature matrix builds
        run: |
          cargo build -p scrapebadger --no-default-features
          cargo build -p scrapebadger --no-default-features --features stream
          cargo build -p scrapebadger --no-default-features --features cli

  codegen-fresh:
    name: generated code & CLI docs are in sync with specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Regenerate from specs
        run: cargo run -p xtask -- gen

      - name: Fail if checked-in output is stale
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated code or docs/CLI.md is out of date with specs/."
            echo "Run 'cargo run -p xtask -- gen' and commit the result."
            exit 1
          fi
