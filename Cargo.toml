[workspace]
resolver = "2"
members = ["crates/scrapebadger", "xtask"]

[workspace.package]
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["Soham Zemse <soham@zemse.in>"]
repository = "https://github.com/zemse/scrapebadger-rust"
homepage = "https://scrapebadger.com"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
